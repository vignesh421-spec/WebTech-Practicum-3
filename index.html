<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
</head>
<body>
<form action="server.php" method="POST">
<label for="first">Name: </label>
<input type="text" id="first" name="first"
pattern="[A-Za-z]+" required>
<br><br>
<label for="first">First Name: </label>
<input type="text" name="first"
pattern="[A-Za-z]+ required>
<br><br>
<label for="last">Last Name: </label>
<input type="text" id="last" name="last"
pattern="[A-Za-z]+" required>
<br><br>
<label for="num">Address: </label>
<input type="text" id="num" name="num"
pattern="[A-Za-z0-9 ]+" required>
<br><br>
<label for="num">Number and Street: </label>
<input type="text" name="num"
pattern="[A-Za-z0-9 ]+" required>
<br><br>
<label for="city">City: </label>
<input type="text" id="city" name="city"
pattern="[A-Za-z-z ]+" required>
<br><br>
<label for="state">State: </label>
<input type="text" id="state" name="state"
pattern="[A-Za-z ]+" required>
<br><br>
<label for="pin">Pin Code: </label>
<input type="text" id="pin" name="pin"
pattern="[0-9]{6}" required>
<br><br>
<label for="in">Check-in Date: </label>
<input type="date" id="in" name="in" required>
<br><br>
<label for="out">Check-out Date: </label>
<input type="date" id="out" name="out" required>
<br><br>
<label for="phone">Phone: </label>
<input type="tel" id="phone" name="phone"
pattern="[0-9]{10}"
title="Enter a 10-digit phone number"
required>
<br><br>
<label for="email">Email: </label>
<input type="email" id="email" name="email" required>
<br><br>
<label for="payment">Payment Method: </label>
<select id="payment" name="payment" required>
<option value="credit">Credit Card</option>
<option value="debit">Debit Card</option>
</select>
<br><br>
<label for="card">Card Number: </label>
<input type="text" id="card" name="card"
pattern="[0-9]{16}"
title="Enter a 16-digit card number"
required>
<br><br>
<label for="special">Special Requests: </label>
<br>
<textarea id="special" name="special"
rows="5" cols="50"></textarea>
<br><br>
<button type="submit">Submit</button>
<button type="reset">Clear</button>
</form>
</body>
</html>
